services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: crypto-kafka
    hostname: kafka

    user: root

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: crypto-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      [
        "/bin/bash",
        "-c"
      ]

    command:
      - |
        set -e

        /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --create \
        --if-not-exists \
        --topic crypto.raw.trades \
        --partitions 3 \
        --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --create \
        --if-not-exists \
        --topic crypto.market.scores \
        --partitions 3 \
        --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --create \
        --if-not-exists \
        --topic crypto.anomalies \
        --partitions 3 \
        --replication-factor 1

        echo "Kafka topics ready."


  namenode:
    image: apache/hadoop:3.5.0
    container_name: crypto-namenode
    hostname: namenode

    user: root

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    command: >
      bash -c "
      mkdir -p /tmp/hadoop-root/dfs/name &&
      if [ ! -f /tmp/hadoop-root/dfs/name/current/VERSION ]; then
        hdfs namenode -format -force -nonInteractive;
      fi &&
      hdfs namenode
      "

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "hdfs dfsadmin -safemode get 2>/dev/null | grep -q 'Safe mode is OFF' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s


  datanode:
    image: apache/hadoop:3.5.0
    container_name: crypto-datanode
    hostname: datanode

    user: root

    depends_on:
      namenode:
        condition: service_started

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    command:
      [
        "hdfs",
        "datanode"
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s


  producer:
    build:
      context: ./producer

    container_name: crypto-producer

    restart: unless-stopped

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: crypto.raw.trades
      SYMBOLS: btcusdt,ethusdt
      BINANCE_WS_BASE: wss://stream.binance.com:9443

    volumes:
      - ./producer:/app

    command:
      [
        "python",
        "-u",
        "producer.py"
      ]


  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu

    container_name: crypto-spark
    hostname: spark

    user: root

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      namenode:
        condition: service_healthy

      datanode:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RAW_TOPIC: crypto.raw.trades
      SCORE_TOPIC: crypto.market.scores
      ANOMALY_TOPIC: crypto.anomalies
      HDFS_BASE: hdfs://namenode:9000/crypto-anomaly
      PYSPARK_PYTHON: python3
      RUNTIME_CONFIG_PATH: /opt/project/runtime/demo_mode.json
      DEMO_MEDIUM_THRESHOLD: "35.0"

    volumes:
      - ./spark:/opt/project/spark
      - ./runtime:/opt/project/runtime
      - ./hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.sql.streaming.forceDeleteTempCheckpointLocation=true
      - /opt/project/spark/stream_processor.py


  dashboard:
    build:
      context: ./dashboard

    container_name: crypto-dashboard

    restart: unless-stopped

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "8501:8501"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCORE_TOPIC: crypto.market.scores
      ANOMALY_TOPIC: crypto.anomalies
      RUNTIME_CONFIG_PATH: /app/runtime/demo_mode.json
      DEMO_MEDIUM_THRESHOLD: "35.0"

    volumes:
      - ./dashboard:/app
      - ./runtime:/app/runtime

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true


volumes:

  kafka_data:

  namenode_data:

  datanode_data: